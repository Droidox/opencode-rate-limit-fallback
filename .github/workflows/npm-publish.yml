name: npm publish

# Publishes to npm via Trusted Publishing (OIDC) — no NPM_TOKEN secret required.
# Provenance attestations are emitted automatically under OIDC.
#
# Prerequisite (one-time, on npmjs.com): configure this repo + workflow as a
# Trusted Publisher for the package @droidox/opencode-rate-limit-fallback
# (package -> Settings -> Trusted Publisher -> GitHub Actions:
#   repository: Droidox/opencode-rate-limit-fallback
#   workflow:   npm-publish.yml).
#
# Trigger: publishing a GitHub Release (tag it vX.Y.Z matching package.json).

on:
  release:
    types: [published]

permissions:
  id-token: write   # REQUIRED for OIDC trusted publishing (+ provenance)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm >= 11.5.1; node 22 ships an older npm.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "$PKG_VERSION" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package.json ($PKG_VERSION)"
            exit 1
          fi

      # Build once and pack to a known filename; the same tarball is scanned and then published.
      - name: Build tarball
        run: |
          npm pack --pack-destination . 2>/dev/null
          TARBALL="$(node -p "const p=require('./package.json'); p.name.replace('@','').replace('/','-')+'-'+p.version+'.tgz'")"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      # Deny-list pattern comes from a repo variable, not hardcoded, so private terms stay out of this public file.
      - name: Guard against private references in the tarball
        env:
          PRIVATE_REF_PATTERN: ${{ vars.PRIVATE_REF_PATTERN }}
        run: |
          if [ -z "$PRIVATE_REF_PATTERN" ]; then
            echo "::warning::PRIVATE_REF_PATTERN not set — skipping private-reference scan."
            exit 0
          fi
          mkdir -p _packcheck
          tar -xzf "$TARBALL" -C _packcheck
          if grep -rniE "$PRIVATE_REF_PATTERN" _packcheck; then
            echo "::error::Tarball contains private references — aborting publish."
            exit 1
          fi
          rm -rf _packcheck
          echo "Tarball is clean of private references."

      # Publish the exact tarball that was scanned. OIDC provides auth; provenance is automatic.
      - name: Publish to npm
        run: npm publish "$TARBALL" --access public
