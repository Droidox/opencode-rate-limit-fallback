name: npm publish

# Publishes to npm via Trusted Publishing (OIDC) — no NPM_TOKEN secret required.
# Provenance attestations are emitted automatically under OIDC.
#
# Prerequisite (one-time, on npmjs.com): configure this repo + workflow as a
# Trusted Publisher for the package @droidox/opencode-rate-limit-fallback
# (package -> Settings -> Trusted Publisher -> GitHub Actions:
#   repository: Droidox/opencode-rate-limit-fallback
#   workflow:   npm-publish.yml).
#
# Trigger: publishing a GitHub Release (tag it vX.Y.Z matching package.json).

on:
  release:
    types: [published]

permissions:
  id-token: write   # REQUIRED for OIDC trusted publishing (+ provenance)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm >= 11.5.1; node 22 ships an older npm.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # prepublishOnly runs clean + build; guard the release tag matches package.json.
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "$PKG_VERSION" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package.json ($PKG_VERSION)"
            exit 1
          fi

      # No NODE_AUTH_TOKEN / NPM_TOKEN: OIDC provides short-lived auth.
      # --provenance is automatic under trusted publishing.
      - name: Publish to npm
        run: npm publish --access public
